<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title> 
    <link rel="stylesheet" href="index.css">  
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Iosevka+Charon+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <div class="main">
        <div class="upperdisplay">
            <p id="display">0</p>
        </div>  
        <div class="belowpart">
            <div class="verticalpartition">
                <!-- <div class="squarekindabutton" style="background-color: rgb(146, 168, 209);">mc</div>  -->
                <div class="squarekindabutton" id="clearBtn" style="background-color:rgb(230, 230, 250);">C</div>
                <div class="squarekindabutton number">7</div>
                <div class="squarekindabutton number">4</div>
                <div class="squarekindabutton number">1</div>
                <div class="squarekindabutton percentage">%</div>
            </div> 
            <div class="verticalpartition">
                <!-- <div class="squarekindabutton" style="background-color: rgb(146, 168, 209);">m+</div>  -->
                <div class="squarekindabutton operator" style="background-color:rgb(230, 230, 250);">÷</div>
                <div class="squarekindabutton number" >8</div>
                <div class="squarekindabutton number">5</div>
                <div class="squarekindabutton number">2</div>
                <div class="squarekindabutton number">0</div>
            </div>
            <div class="verticalpartition">
                <!-- <div class="squarekindabutton" style="background-color: rgb(146, 168, 209);">m-</div>  -->
                <div class="squarekindabutton operator" style="background-color:rgb(230, 230, 250);">x</div>
                <div class="squarekindabutton number">9</div>
                <div class="squarekindabutton number">6</div>
                <div class="squarekindabutton number">3</div>
                <div class="squarekindabutton number" >.</div>
            </div>
            <div class="verticalpartition">
                <!-- <div class="squarekindabutton" style="background-color: rgb(146, 168, 209); ;width:59px; height: 59px; ">mr</div>  -->
                <div class="squarekindabutton" id="cutBtn" style="background-color:rgb(230, 230, 250); width:59px; height: 59px; "><img src="button.png" width="70%" height="70%" ></div>
                <div class="squarekindabutton operator" style="background-color:rgb(136, 176, 75);  ;width:59px; height: 59px; ">-</div>
                <div class="squarekindabutton operator" style="background-color:rgb(136, 176, 75) ;width:59px; height: 59px; ">+</div>
                
                <div class="squarekindabutton" id="equal" style="height: 130px; background-color:rgb(136, 176, 75);">=</div>
            </div>
        </div> 

        
    </div>
    


    <script src="app.js"></script>
</body>
</html>
